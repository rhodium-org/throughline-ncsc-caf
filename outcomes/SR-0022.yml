uid: SR-0022
type: system_requirement
status: approved
title: CAF B4.b — Secure Configuration
text: You securely configure network and information systems that support the operation of your
  essential function(s).
links:
- target: UR-0008
  type: implements
attrs:
  source_ref: B4.b
  igp_not_achieved:
  - You have not identified the assets that need to be carefully configured to maintain the
    security of network and information systems supporting your essential function(s).
  - Policies relating to the security of operating system builds or configuration are not applied
    consistently across network and information systems relating to your essential function(s).
  - Configuration details are not recorded or lack enough information to be able to rebuild
    the system or device.
  - The recording of security changes or adjustments that affect your essential function(s)
    is lacking or inconsistent.
  - Generic, shared, default name and built-in accounts have not been removed or disabled.
  - Standard users are able to change settings that would adversely impact the security of network
    and information systems supporting your essential function(s).
  igp_partially_achieved:
  - You have identified and documented the assets that need to be carefully configured to maintain
    the security of network and information systems supporting your essential function(s).
  - Secure platform and device builds are used across the estate.
  - Consistent, secure and minimal system and device configurations are applied across the same
    types of environment.
  - Changes and adjustments to security configurations at security boundaries of network and
    information systems supporting your essential function(s) are approved and documented.
  - You verify software before installation is permitted.
  - Generic, shared, default name and built-in accounts have been removed or disabled. Where
    this is not possible, credentials to these accounts have been changed. Service accounts
    are appropriately protected.
  - Standard users are not able to change settings that would adversely impact the security
    of network and information systems supporting your essential function(s).
  igp_achieved:
  - You have identified, documented and actively manage (e.g. maintain security configurations,
    patching, updating according to good practice) the assets that need to be carefully configured
    to maintain the security of network and information systems supporting your essential function(s).
  - All platforms conform to your secure, defined baseline build, or the latest known good configuration
    version for that environment.
  - You closely and effectively manage changes in your environment, ensuring that network and
    information systems configurations are secure and documented.
  - You regularly review and validate that network and information systems have the expected,
    secure settings and configuration.
  - Only permitted software can be installed.
  - If automated decision-making technologies are in use, their operation is well understood,
    and decisions can be replicated.
  - Generic, shared, default name and built-in accounts have been removed or disabled. Where
    this is not possible, credentials to these accounts have been changed. Service accounts
    are appropriately protected.
