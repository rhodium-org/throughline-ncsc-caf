uid: SR-0002
type: system_requirement
status: approved
title: CAF A1.b — Roles and Responsibilities
text: Your organisation has established roles and responsibilities for the security of network
  and information systems at all levels, with clear and well-understood channels for communicating
  and escalating risks.
links:
- target: UR-0001
  type: implements
attrs:
  source_ref: A1.b
  igp_not_achieved:
  - Key roles are missing, left vacant, or fulfilled on an ad-hoc or informal basis.
  - Staff are assigned security responsibilities but without adequate authority or resources
    to fulfil them.
  - Staff are unsure what their responsibilities are for the security of the essential function(s).
  igp_achieved:
  - Key roles and responsibilities for the security of network and information systems supporting
    your essential function(s) have been identified. These are reviewed regularly to ensure
    they remain fit for purpose.
  - Appropriately capable and knowledgeable staff fill those roles and are given the time, authority,
    and resources to carry out their duties.
  - There is clarity on who in your organisation has overall accountability for the security
    of network and information systems supporting your essential function(s).
