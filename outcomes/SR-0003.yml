uid: SR-0003
type: system_requirement
status: approved
title: CAF A1.c — Decision-making
text: You have senior-level accountability for the security of network and information systems,
  and delegate decision-making authority appropriately and effectively. Risks to network and
  information systems related to the operation of your essential function(s) are considered
  in the context of other organisational risks.
links:
- target: UR-0001
  type: implements
attrs:
  source_ref: A1.c
  igp_not_achieved:
  - What should be relatively straightforward risk decisions are constantly referred up the
    chain, or not made.
  - Risks are resolved informally (or ignored) at a local level when the use of a more formal
    risk reporting mechanism would be more appropriate.
  - Decision-makers are unsure of what senior management's risk appetite is, or only understand
    it in vague terms such as "averse" or "cautious".
  - Decision-makers are unable to justify their risk management decisions.
  - Organisational structure causes risk decisions to be made in isolation. (e.g. engineering
    and IT do not talk to each other about risk).
  - Risk priorities are too vague to make meaningful distinctions between them. (e.g. almost
    all risks are rated 'medium' or 'amber').
  igp_achieved:
  - Senior management have visibility of key risk decisions made throughout the organisation.
  - Risk management decision-makers understand their responsibilities for making effective and
    timely decisions in the context of the risk appetite regarding the essential function(s),
    as set by senior management.
  - Risk management decision-making is delegated and escalated where necessary, across the organisation,
    to people who have the skills, knowledge, tools and authority they need.
  - Risk management decisions are regularly reviewed to ensure their continued relevance and
    validity.
