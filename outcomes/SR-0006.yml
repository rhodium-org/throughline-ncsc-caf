uid: SR-0006
type: system_requirement
status: approved
title: CAF A2.c — Assurance
text: You have gained confidence in the effectiveness of the security of your technology, people,
  and processes relevant to the operation of network and information systems supporting your
  essential function(s).
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: A2.c
  igp_not_achieved:
  - A particular product or service is seen as a "silver bullet" and vendor claims are taken
    at face value.
  - Assurance methods are applied without appreciation of their strengths and limitations.
  - Assurance is assumed because there have been no known problems to date.
  igp_achieved:
  - You validate that the security measures in place to protect network and information systems
    supporting your essential function(s) are effective and remain effective for the lifetime
    over which they are needed.
  - You understand the assurance methods available to you and choose appropriate methods to
    gain confidence in the security of network and information systems supporting your essential
    function(s).
  - Your confidence in the security as it relates to your technology, people, and processes
    can be justified to, and verified by, a third party.
  - Security deficiencies uncovered by assurance activities are assessed, prioritised and remedied
    when necessary in a timely and effective way.
  - The methods used for assurance are reviewed to ensure they are working as intended and remain
    the most appropriate method to use.
