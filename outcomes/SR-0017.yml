uid: SR-0017
type: system_requirement
status: approved
title: CAF B3.b — Data in Transit
text: You have protected the transit of data important to the operation of network and information
  systems supporting your essential function(s). This includes the transfer of data to third
  parties.
links:
- target: UR-0007
  type: implements
attrs:
  source_ref: B3.b
  igp_not_achieved:
  - You do not know what all your data links are, or which carry data important to the operation
    of the essential function(s).
  - Data important to the operation of the essential function(s) travels without technical protection
    over non-trusted or openly accessible carriers.
  - Critical data paths that could fail, be jammed, be overloaded, etc. have no alternative
    path.
  igp_partially_achieved:
  - You have identified and protected (effectively and proportionately) all the data links that
    carry data important to the operation of your essential function(s).
  - You apply appropriate physical and / or technical means (e.g. cryptography) to protect data
    that travels over non-trusted or openly accessible carriers, but you have limited or no
    confidence in the robustness of the protection applied.
  igp_achieved:
  - You have identified and protected (effectively and proportionately) all the data links that
    carry data important to the operation of your essential function(s).
  - You apply appropriate physical and / or technical means (e.g. cryptography) to protect data
    that travels over non-trusted or openly accessible carriers, with justified confidence in
    the robustness of the protection applied.
  - Suitable alternative transmission paths are available where there is a significant risk
    of impact on the operation of the essential function(s) due to resource limitation (e.g.
    transmission equipment or function failure, or important data being blocked or jammed).
