title: B4 — System Security
text: System Security
rationale: Network and information systems and technology critical for the operation of essential
  functions are protected from cyber attack. An organisational understanding of risk to essential
  functions informs the use of robust and reliable protective security measures to effectively
  limit opportunities for threat actors to compromise networks and systems.
