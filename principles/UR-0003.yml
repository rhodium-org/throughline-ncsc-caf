title: C2 — Threat Hunting
text: Threat Hunting
rationale: The organisation proactively seeks to detect, within networks and information systems,
  adverse activity affecting, or with the potential to affect, the operation of essential functions
  even when the activity evades standard security prevent / detect solutions (or when standard
  solutions are not deployable).
