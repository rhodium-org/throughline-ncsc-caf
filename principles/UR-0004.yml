title: A4 — Supply Chain
text: Supply Chain
rationale: The organisation understands and manages security risks to network and
  information systems supporting the operation of essential functions that arise
  as a result of dependencies on suppliers. This includes ensuring that appropriate
  measures are employed where third party services are used.
