title: D1 — Response and Recovery Planning
text: Response and Recovery Planning
rationale: There are well-defined and tested incident management processes in place, that aim
  to ensure continuity of essential function(s) in the event of system or service failure. Mitigation
  activities designed to contain or limit the impact of compromise are also in place.
